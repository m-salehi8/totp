<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a1414" />
      <stop offset="55%" stop-color="#4a1010" />
      <stop offset="100%" stop-color="#240505" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a63a3a" />
      <stop offset="50%" stop-color="#7d2323" />
      <stop offset="100%" stop-color="#5a1414" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#5a1414" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer timer ring (circular countdown symbol) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#7d2323" stroke-width="12" opacity="0.3" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#f2c6c6" stroke-width="12" stroke-linecap="round" stroke-dasharray="1162" stroke-dashoffset="350" />

  <!-- Shield Base -->
  <path d="M 256 120 L 372 168 C 372 272 300 354 256 388 C 212 354 140 272 140 168 Z" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 205 256 L 244 295 L 314 212" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
</svg>
