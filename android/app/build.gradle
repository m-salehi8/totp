plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.authenticator.app'
    compileSdk 34

    defaultConfig {
        applicationId "ir.authenticator.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero external dependencies needed - uses pure Android SDK framework to guarantee maximum stability and zero crashes
}
